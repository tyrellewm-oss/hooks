# Linux verification for hook work (litesvm has no Windows build; the program needs the Solana SBF toolchain).
#   sim:     simulated launches + trades against the DEPLOYED devnet DBC + Hookd hook bytecode (read-only RPC fetch)
#   program: builds the hook program from source and runs the full test suite (litesvm tests included)
# Devnet/local only: no keys, no secrets, nothing is sent to any cluster. Runs on feature-branch pushes and by hand.
name: sim
on:
  push:
    branches: ['feat/**', 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Simulated launch (baseline, deployed devnet programs)
        run: node --import tsx scripts/sim/verify_baseline.ts

  program:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Cache Solana toolchain and cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: solana-v2.3.13-${{ hashFiles('Cargo.lock') }}
      - name: Install Solana (Agave) toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.3.13/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Build the hook program (release + test-slots)
        run: bash scripts/build.sh
      - name: Test suite (unit + litesvm against the built program)
        run: node --import tsx --test --test-timeout=120000 tests/*.test.ts
      - name: Simulated launches on the built program (baseline + v2 buy rules)
        env: { SIM_HOOK_SO: target/deploy/trenches_hook.so }
        run: |
          node --import tsx scripts/sim/verify_baseline.ts
          node --import tsx scripts/sim/verify_rules.ts
