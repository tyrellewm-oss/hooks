<script>
  // Theme before first paint (no flash). Dark is the default; the toggle stores the choice in this browser.
  try { var t = localStorage.getItem('hookd-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
  /* Preloader: the hook drops in on its chain, swings, takes a bite, then the name and tagline rise in. It plays once and
     holds; src/main.tsx fades it out once the page has loaded. If the app never starts, it still leaves after 8 s. */
  #preloader { position: fixed; inset: 0; z-index: 1000; display: grid; place-content: center; justify-items: center; gap: 36px; overflow: hidden;
    background-color: #0a0a0a; background-image: linear-gradient(rgba(57, 255, 122, .05) 1px, transparent 1px), linear-gradient(90deg, rgba(57, 255, 122, .05) 1px, transparent 1px);
    background-size: 24px 24px; padding-bottom: 6vh; animation: pl-out .4s ease 8s forwards; }
  #preloader.done { animation: pl-out .4s ease forwards; }
  .pl-lockup { position: relative; width: 402px; height: 98px; zoom: 1.25; }
  .pl-rig { position: absolute; left: 0; top: 0; width: 118px; height: 98px; transform-origin: 59px -50vh; animation: pl-rig 2.7s cubic-bezier(.2, .8, .2, 1) both; }
  .pl-rig img { position: absolute; inset: 0; }
  .pl-chain { position: absolute; left: 0; top: -1495px; overflow: visible; }
  .pl-chain path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .pl-chain path { stroke: #fff; stroke-width: 3.4; }
  .pl-word { position: absolute; left: 130px; top: 14px; animation: pl-rise 2.7s cubic-bezier(.2, .8, .2, 1) both; }
  .pl-cap { margin: 0; font: 600 11px/1 'Geist Mono', ui-monospace, monospace; letter-spacing: .22em; text-transform: uppercase; color: #39ff7a; animation: pl-rise 2.7s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes pl-rig { 0% { transform: translateY(-260px) } 29.7% { transform: translateY(10px) } 40.5% { transform: translateY(10px) rotate(3deg) } 51.4% { transform: translateY(10px) rotate(-2deg) } 60.8% { transform: translateY(10px) rotate(.8deg) } 70% { transform: translateY(10px) } 88%, 100% { transform: none } }
  @keyframes pl-rise { 0%, 70% { opacity: 0; transform: translateY(28px) } 88%, 100% { opacity: 1; transform: none } }
  @keyframes pl-out { to { opacity: 0; visibility: hidden } }
  @media (max-width: 560px) { .pl-lockup { zoom: .8; } #preloader { gap: 24px; } }
  @media (prefers-reduced-motion: reduce) { .pl-rig, .pl-word, .pl-cap { animation: none; } }
</style>
